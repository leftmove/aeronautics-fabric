plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

repositories {
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org/'
    }
}

evaluationDependsOn(':simulated:fabric')
evaluationDependsOn(':aeronautics:fabric')
evaluationDependsOn(':offroad:fabric')

def fabricProjects = [
        project(':simulated:fabric'),
        project(':aeronautics:fabric'),
        project(':offroad:fabric')
]

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation("com.simibubi.create:create-fabric:${create_fabric_version}")

    fabricProjects.each {
        implementation it
    }
}

loom {
    mods {
        fabricProjects.each { fabricProject ->
            "${fabricProject.parent.name}" {
                sourceSet fabricProject.sourceSets.main
            }
        }
    }

    runs {
        client {
            client()
            setConfigName("Fabric Client (${project.path})")
            ideConfigGenerated(true)
            runDir("runs/client")
        }
        server {
            server()
            setConfigName("Fabric Server (${project.path})")
            ideConfigGenerated(true)
            runDir("runs/server")
        }
    }
}
