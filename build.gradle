plugins {
    // https://projects.neoforged.net/neoforged/moddevgradle
    id 'net.neoforged.moddev' version '2.0.140' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.140' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.16.1' apply false
}

import org.gradle.api.attributes.java.TargetJvmVersion
import org.gradle.api.attributes.CompatibilityCheckDetails
import org.gradle.api.attributes.AttributeCompatibilityRule

abstract class RelaxJvmVersionCompatibility implements AttributeCompatibilityRule<Integer> {
    @Override
    void execute(CompatibilityCheckDetails<Integer> details) {
        details.compatible()
    }
}

allprojects {
    if (project == rootProject) {
        version = '1.0.0'
    }
}

def configureModSubprojects(String modName) {
    configure(subprojects.findAll { it.path.startsWith(":${modName}:") }) {
        def modProps = new Properties()
        file("${rootProject.projectDir}/${modName}/gradle.properties").withInputStream { modProps.load(it) }

        modProps.each { key, value ->
            project.ext.set(key.toString(), value)
        }

        version = project.mod_version
        group = modProps.group
        description = modProps.description
    }
}

configureModSubprojects('simulated')
configureModSubprojects('aeronautics')
configureModSubprojects('offroad')

subprojects {
    pluginManager.withPlugin('java') {
        dependencies.attributesSchema.attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE) {
            compatibilityRules.add(RelaxJvmVersionCompatibility)
        }
        tasks.withType(JavaCompile).configureEach {
            options.compilerArgs << '-Xmaxerrs' << '10000'
            options.compilerArgs << '-Xmaxwarns' << '10000'
        }
    }

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            url = "https://maven.ryanhcode.dev/releases"
        }

        maven {
            url = "https://maven.ryanhcode.dev/snapshots"
        }

        maven {
            url = "https://maven.ryanhcode.dev/private"

            authentication {
                basic(BasicAuthentication)
            }

            credentials {
                username = System.getenv('local_maven_user') ?: project.findProperty('ryanhcodeMavenUser') ?: ''
                password = System.getenv('local_maven_token') ?: project.findProperty('ryanhcodeMavenToken') ?: ''
            }
        }

        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://mvn.devos.one/snapshots" } // Create Fabric, Registrate Fabric
        maven { url = "https://maven.ithundxr.dev/mirror" } // Forge Registrate
        maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" } // ForgeConfigAPIPort
        maven { url = "https://mvn.devos.one/releases/" } // Porting Lib
        maven { url = "https://maven.jamieswhiteshirt.com/libs-release" } // Reach Entity Attributes
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.shedaniel.me/" }
        maven { url = "https://maven.terraformersmc.com/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.quiltmc.org/repository/release" }

        maven { url = "https://maven.theillusivec4.top/" } // Curios API

        maven {
            name = 'Jared maven'
            url =   'https://maven.blamejared.com/'
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        maven {
            url = "https://maven.squiddev.cc"
            content {
                includeGroup("cc.tweaked")
            }
        }
    }
}