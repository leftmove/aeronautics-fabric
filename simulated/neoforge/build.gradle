plugins {
    id 'net.neoforged.moddev.legacyforge'
    id 'multiloader-loader'
    id 'multiloader-neoforge'
}

def generatedResources = project(":simulated:common").file("src/generated/resources")
def commonResources = project(":simulated:common").file("src/main/resources")

legacyForge {
    version = forge_full_version

    def at = project(':simulated:common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        configureEach {
            ideName = "Simulated Forge ${it.name.capitalize()} (${project.path})"
        }

        data {
            data()
            gameDirectory = project.file('runs/data')
            programArguments.addAll '--all',
                    '--mod', 'simulated',
                    '--output', generatedResources.absolutePath,
                    '--existing', commonResources.absolutePath,
                    '--existing-mod', 'create'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources {
    srcDir generatedResources.absolutePath
}
